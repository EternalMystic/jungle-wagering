# Roda a cada push e PR com PostgreSQL e emulador SQS reais (service containers).
#
# Emulador de SQS: MiniStack (sem token) — ver docs/DECISOES.md D13.
# Se test/integration/sqs-emulator.test.ts ficar vermelho no MiniStack, a troca é por
# localstack/localstack com o secret LOCALSTACK_AUTH_TOKEN (imagem atual exige token).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wagering
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      # MiniStack (MIT, sem token) — D13. test/integration/sqs-emulator.test.ts prova
      # FIFO, MessageGroupId, MessageDeduplicationId e RedrivePolicy neste emulador.
      sqs:
        image: ministackorg/ministack:1.5.33@sha256:b58186186515a372798ccf0ca9975c295db219b5a811975337d6967b968e07b4
        ports: ["4566:4566"]
        options: >-
          --health-cmd "python3 -c 'import socket;socket.create_connection((\"127.0.0.1\",4566),2)'"
          --health-interval 3s --health-timeout 5s --health-retries 40 --health-start-period 5s

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/wagering
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Padrões proibidos (dinheiro em number, mocks, ledger mutável)
        run: bun run scripts/scan-forbidden.ts

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test test/unit

      - name: Filas SQS
        run: bun run sqs:setup

      - name: Migrations — round-trip up/down/up
        run: bun run migration:up && bun run migration:down && bun run migration:up

      - name: Gabarito do schema (ataques, corridas, invariantes)
        run: bun run verify:schema

      - run: bun run test:acceptance
      - run: bun run test:integration

      - name: Concorrência — 3 execuções seguidas (intermitência é bug)
        run: for i in 1 2 3; do bun run test:concurrency || exit 1; done
