# Roda a cada push e PR com PostgreSQL e emulador SQS reais, subidos pelo MESMO
# docker-compose.yml do README: o CI testa o ambiente que um avaliador vai usar, e o
# teste de Postgres pausado (`docker compose pause`) funciona aqui como na máquina local.
#
# Emulador de SQS: MiniStack (sem token) — ver docs/DECISOES.md D13.
# Se test/integration/sqs-emulator.test.ts ficar vermelho no MiniStack, a troca é por
# localstack/localstack com o secret LOCALSTACK_AUTH_TOKEN (imagem atual exige token).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:55432/wagering
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4   # a mesma versão usada no desenvolvimento

      - name: PostgreSQL e emulador SQS (docker-compose.yml)
        run: docker compose up -d --wait

      - run: bun install --frozen-lockfile

      - name: Padrões proibidos (dinheiro em number, mocks, ledger mutável)
        run: bun run scripts/scan-forbidden.ts

      - run: bun run typecheck
      - run: bun run lint
      - run: bun test test/unit

      - name: Filas SQS
        run: bun run sqs:setup

      - name: Migrations — round-trip up/down/up
        run: bun run migration:up && bun run migration:down && bun run migration:up

      - name: Gabarito do schema (ataques, corridas, invariantes)
        run: bun run verify:schema

      - run: bun run test:acceptance
      - run: bun run test:integration

      - name: Concorrência — 3 execuções seguidas (intermitência é bug)
        run: for i in 1 2 3; do bun run test:concurrency || exit 1; done

      - name: Logs dos containers (só em falha)
        if: failure()
        run: docker compose logs --no-color --tail 200
